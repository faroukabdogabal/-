<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#132A21" />
      <stop offset="100%" stop-color="#0B0F14" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Rub el Hizb (8-pointed Islamic geometric star) -->
  <g transform="translate(256 256)">
    <rect
      x="-128"
      y="-128"
      width="256"
      height="256"
      rx="18"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="14"
    />
    <rect
      x="-128"
      y="-128"
      width="256"
      height="256"
      rx="18"
      transform="rotate(45)"
      fill="none"
      stroke="url(#emeraldGrad)"
      stroke-width="14"
    />
    <circle cx="0" cy="0" r="84" fill="#0B1310" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Open Quran & Play Symbol -->
    <path
      d="M-46 18 C-28 6 -10 10 0 22 C10 10 28 6 46 18 L46 -26 C28 -36 10 -32 0 -20 C-10 -32 -28 -36 -46 -26 Z"
      fill="none"
      stroke="url(#emeraldGrad)"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <polygon points="-8,-52 14,-39 -8,-26" fill="url(#goldGrad)" />
  </g>
</svg>
